name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify affected projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency boundaries
        run: pnpm deps:check

      - name: Lint repository tooling
        run: pnpm lint:workspace

      - name: Verify affected projects
        run: pnpm nx affected -t lint typecheck test build --base="$NX_BASE" --head="$NX_HEAD"

      - name: Check version plans
        if: github.event_name == 'pull_request'
        run: pnpm nx release plan:check --base="$NX_BASE" --head="$NX_HEAD"

      - name: Select affected publishable packages
        id: packages
        shell: bash
        run: |
          affected_json="$(pnpm nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --json)"
          DSH_PROJECTS_JSON="$affected_json" node scripts/workspace-packages.mjs --format=github-output >> "$GITHUB_OUTPUT"

      - name: Verify affected tarballs
        if: steps.packages.outputs.count != '0'
        run: pnpm tarball:verify:packages ${{ steps.packages.outputs.directories }}
