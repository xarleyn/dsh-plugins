name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Affected lint
        run: pnpm nx affected -t lint

      - name: Affected typecheck
        run: pnpm nx affected -t typecheck

      - name: Affected test
        run: pnpm nx affected -t test

      - name: Affected build
        run: pnpm nx affected -t build

      - name: Check version plans (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm nx release plan:check
