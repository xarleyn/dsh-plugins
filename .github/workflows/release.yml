name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the release without changing GitHub or npm
        required: true
        default: true
        type: boolean
      first_release:
        description: Resolve versions from package.json because no release tags exist yet
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a version plan
        shell: bash
        run: compgen -G '.nx/version-plans/*.md' > /dev/null

      - name: Preview release
        if: inputs.dry_run
        shell: bash
        run: |
          args=(--dry-run)
          if [[ "${{ inputs.first_release }}" == "true" ]]; then
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"

      - name: Apply version plans
        if: inputs.dry_run == false
        id: packages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          args=(--skip-publish --yes)
          if [[ "${{ inputs.first_release }}" == "true" ]]; then
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"
          node scripts/workspace-packages.mjs --release-commit --require --format=github-output >> "$GITHUB_OUTPUT"
          node scripts/workspace-packages.mjs --release-commit --require --format=tsv > "$RUNNER_TEMP/release-packages.tsv"

      - name: Run release gates
        if: inputs.dry_run == false
        run: |
          pnpm deps:check
          pnpm check

      - name: Pack release tarballs
        if: inputs.dry_run == false
        shell: bash
        run: |
          mkdir -p tarballs
          for package_dir in ${{ steps.packages.outputs.directories }}; do
            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          done

      - name: Verify release tarballs
        if: inputs.dry_run == false
        run: pnpm tarball:verify:packages -- ${{ steps.packages.outputs.directories }}

      - name: Upload release artifacts
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Push release commit and tags
        if: inputs.dry_run == false
        run: git push origin HEAD:main --follow-tags

      - name: Upgrade npm for trusted publishing
        if: inputs.dry_run == false
        run: npm install --global npm@latest

      - name: Publish to npm with OIDC
        if: inputs.dry_run == false
        shell: bash
        run: |
          args=(--projects="${{ steps.packages.outputs.projects }}" --output-style=static)
          if [[ "${{ inputs.first_release }}" == "true" ]]; then
            args+=(--first-release)
          fi
          pnpm nx release publish "${args[@]}"

      - name: Create per-package GitHub Releases
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r name version _directory tarball; do
            gh release create "${name}@${version}" "tarballs/${tarball}" \
              --verify-tag \
              --title "${name} ${version}" \
              --generate-notes
          done < "$RUNNER_TEMP/release-packages.tsv"
