name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the release without changing GitHub or npm
        required: true
        default: true
        type: boolean
      first_release:
        description: Resolve versions from package.json because no release tags exist yet
        required: true
        default: false
        type: boolean
      publish_only:
        description: Publish versions already tagged by a previous run
        required: true
        default: false
        type: boolean
      create_github_releases:
        description: Create one GitHub Release for the release wave after npm publication
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

# Validating a release means the same Nx targets the PR workflow runs, but a
# release resolves its own scope: the packages it is about to publish, not the
# ones a diff touched. Those run one job per package on their own runners, and
# the projects that stay out of the release are swept in a job beside them, so
# the workspace is still covered end to end without a single job walking it
# target by target.
jobs:
  # Resolves the release once - version plans, release commit, selected
  # packages, registry preflight - and hands the jobs below the two things
  # they cannot compute for themselves: the release commit, which exists only
  # on this runner, and the matrix of packages to fan out.
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.packages.outputs.count }}
      matrix: ${{ steps.packages.outputs.matrix }}
      gates_projects: ${{ steps.packages.outputs.gates_projects }}
      release_commit: ${{ steps.capture.outputs.created }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Release whatever ref the workflow was dispatched on: main for
          # regular releases, a branch for test releases without touching main.
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A plan file nx cannot parse is ignored without a warning, so requiring
      # the files to exist is not enough to guarantee a release has work to do.
      - name: Require a valid version plan
        if: inputs.publish_only == false
        run: node scripts/verify-package-hygiene.mjs --version-plans-only

      - name: Preview release
        if: inputs.dry_run && inputs.publish_only == false
        shell: bash
        run: |
          args=(--dry-run)
          if [[ "${{ inputs.first_release }}" == "true" ]]; then
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"

      - name: Apply version plans
        if: inputs.dry_run == false && inputs.publish_only == false
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The release commit is diffed against this ref below, so the base has
          # to be recorded before Nx touches the workspace.
          git rev-parse HEAD > "$RUNNER_TEMP/release-base.sha"

          args=(--skip-publish)
          if [[ "${{ inputs.first_release }}" == "true" ]]; then
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"

      # Nx commits the versions and changelogs but removes the consumed version
      # plans outside that commit, and the jobs below need the release as one
      # commit they can replay: a branch that kept plans the release already
      # spent would apply them again on the next run. The amendment is only ever
      # reached when Nx produced a commit of its own - the base commit is pushed
      # already and is never rewritten.
      - name: Capture the release commit
        id: capture
        if: inputs.dry_run == false && inputs.publish_only == false
        shell: bash
        run: |
          base="$(cat "$RUNNER_TEMP/release-base.sha")"
          git add --all
          if ! git diff --cached --quiet; then
            if [[ "$(git rev-parse HEAD)" == "$base" ]]; then
              git commit -m "chore(release): publish"
            else
              git commit --amend --no-edit
            fi
          fi

          # Every commit since the base, so the patch carries the whole release
          # even if a future Nx splits it across more than one commit.
          git format-patch --stdout "$base"..HEAD > "$RUNNER_TEMP/release-commit.patch"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload the release commit
        if: inputs.dry_run == false && inputs.publish_only == false
        uses: actions/upload-artifact@v4
        with:
          name: release-commit
          path: ${{ runner.temp }}/release-commit.patch
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable within a run, so a rerun of this job would
          # otherwise fail to replace its own.
          overwrite: true

      - name: Select release packages
        id: packages
        shell: bash
        run: |
          # A preview changes nothing and publishes nothing, so there is no
          # released set to fan out. An empty matrix keeps every job below
          # skipped while leaving the outputs they read well formed.
          if [[ "${{ inputs.dry_run }}" == "true" && "${{ inputs.publish_only }}" == "false" ]]; then
            printf 'count=0\nprojects=\ngates_projects=\nmatrix={"include":[]}\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selection_args=()
          if [[ "${{ inputs.publish_only }}" == "false" ]]; then
            selection_args+=(--release-commit)
          fi

          DSH_ALL_PROJECTS_JSON="$(pnpm nx show projects --json)" \
            node scripts/workspace-packages.mjs "${selection_args[@]}" --require \
              --format=release-matrix >> "$GITHUB_OUTPUT"
          node scripts/workspace-packages.mjs "${selection_args[@]}" --require --format=tsv > "$RUNNER_TEMP/release-packages.tsv"

          if [[ "${{ inputs.publish_only }}" == "true" ]]; then
            # A release-wave tag on HEAD means the release commit is already
            # pushed. Per-package tags are the previous release scheme and
            # keep answering for releases made before the wave tag existed.
            if git tag --points-at HEAD | grep -q '^release/'; then
              echo "HEAD carries the release wave tag $(git tag --points-at HEAD | grep '^release/' | head -1)"
            else
              while IFS=$'\t' read -r name version _directory _tarball; do
                git rev-parse --verify --quiet "refs/tags/${name}@${version}^{commit}" > /dev/null || {
                  echo "Missing release tag ${name}@${version}" >&2
                  exit 1
                }
              done < "$RUNNER_TEMP/release-packages.tsv"
            fi
          fi

      # npm cannot claim a package name through Trusted Publishing: a Trusted
      # Publisher is configured on a package that already exists, and the
      # registry answers a workflow's first publish with a misleading 404. A
      # package nobody bootstrapped by hand would otherwise be discovered inside
      # the publish loop, after the release commit is ready to be pushed. The
      # check runs here, before the fan-out, so a missing bootstrap costs
      # seconds instead of a whole validation pass.
      - name: Verify packages exist on npm
        if: inputs.dry_run == false || inputs.publish_only
        run: node scripts/verify-package-publication.mjs --tsv="$RUNNER_TEMP/release-packages.tsv"

  # Everything repository-wide, plus the projects the release does not publish.
  # This job and the package matrix run beside each other and cover the
  # workspace between them: every project is verified exactly once.
  gates:
    name: Repository gates
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the release commit
        if: needs.prepare.outputs.release_commit == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-commit
          path: ${{ runner.temp }}

      # The gates read the tree npm is about to receive, versions included.
      - name: Replay the release commit
        if: needs.prepare.outputs.release_commit == 'true'
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: git am "$RUNNER_TEMP/release-commit.patch"

      - name: Check dependency boundaries
        run: pnpm deps:check

      - name: Lint repository tooling
        run: pnpm lint:workspace

      - name: Check formatting
        run: pnpm format

      - name: Verify plugin logging contract
        run: pnpm verify:logging

      - name: Verify publishable plugin package hygiene
        run: pnpm verify:packages

      - name: Test repository tooling
        run: pnpm test:release

      - name: Verify the projects outside the release
        if: needs.prepare.outputs.gates_projects != ''
        env:
          NX_PROJECTS: ${{ needs.prepare.outputs.gates_projects }}
        run: pnpm nx run-many -t lint typecheck test build verify --projects="$NX_PROJECTS" --output-style=static

  projects:
    name: Package / ${{ matrix.project }}
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the release commit
        if: needs.prepare.outputs.release_commit == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-commit
          path: ${{ runner.temp }}

      - name: Replay the release commit
        if: needs.prepare.outputs.release_commit == 'true'
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: git am "$RUNNER_TEMP/release-commit.patch"

      - name: Verify project
        env:
          NX_PROJECT: ${{ matrix.project }}
        run: pnpm nx run-many -t lint typecheck test build verify --projects="$NX_PROJECT" --output-style=static

      # The tarball this job publishes is the one it also verifies: packing and
      # inspecting it here is what keeps a broken package from reaching the
      # publish loop, and the artifact it uploads is what that loop publishes.
      - name: Pack the release tarball
        env:
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        run: |
          mkdir -p tarballs
          pnpm --dir "$PACKAGE_DIRECTORY" pack --pack-destination "$GITHUB_WORKSPACE/tarballs"

      - name: Verify the release tarball
        env:
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        run: pnpm tarball:verify:packages "$PACKAGE_DIRECTORY"

      - name: Upload the release tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-${{ matrix.slug }}
          path: ${{ github.workspace }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable within a run, so a rerun of this job would
          # otherwise fail to replace its own.
          overwrite: true

  # Publication is the only step that changes state outside this repository, so
  # it runs on its own runner after every gate has passed, and before the
  # release commit is pushed. A publish that fails leaves the branch untouched,
  # version plans included, and a rerun resolves the same versions and retries
  # only what npm is missing. Publishing first is also what makes a pushed tag
  # mean something: every tag in the repository names a version the registry
  # already has.
  publish:
    name: Publish the release
    needs: [prepare, gates, projects]
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.count != '0' &&
      needs.gates.result == 'success' && needs.projects.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # This job reads package.json and talks to the registry; it builds
      # nothing, so it installs nothing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download the release commit
        if: needs.prepare.outputs.release_commit == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-commit
          path: ${{ runner.temp }}

      # Replaying the commit here, rather than pushing what the prepare job
      # committed, is what keeps the push and the publication on one commit:
      # this runner is the one that pushes it, and the identity below is also
      # what the wave tag is created with.
      - name: Replay the release commit
        if: needs.prepare.outputs.release_commit == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am "$RUNNER_TEMP/release-commit.patch"

      - name: Download release tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: npm-tarball-*
          path: ${{ github.workspace }}/tarballs
          merge-multiple: true

      # Read back from the tree that is about to be pushed, so the rows below
      # name the tarballs the package jobs produced, versions included.
      - name: Select release packages
        shell: bash
        run: |
          selection_args=()
          if [[ "${{ inputs.publish_only }}" == "false" ]]; then
            selection_args+=(--release-commit)
          fi

          node scripts/workspace-packages.mjs "${selection_args[@]}" --require --format=tsv > "$RUNNER_TEMP/release-packages.tsv"

      - name: Upload release artifacts
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable within a run, so a rerun of this job would
          # otherwise fail to replace its own.
          overwrite: true

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.15.0

      - name: Publish to npm with OIDC
        if: inputs.dry_run == false || inputs.publish_only
        shell: bash
        run: |
          failed=()
          while IFS=$'\t' read -r name version _directory tarball; do
            if npm view "${name}@${version}" version --json > /dev/null 2>&1; then
              echo "Skipping ${name}@${version}: already published"
              continue
            fi

            tarball_path="$GITHUB_WORKSPACE/tarballs/$tarball"
            if [[ ! -f "$tarball_path" ]]; then
              echo "Missing packed tarball: $tarball_path" >&2
              exit 1
            fi

            args=("$tarball_path" --access public)
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              args+=(--dry-run)
            fi

            # A rejected package must not hide the ones behind it: collect the
            # failures, then report them together.
            if ! npm publish "${args[@]}"; then
              failed+=("${name}@${version}")
            fi
          done < "$RUNNER_TEMP/release-packages.tsv"

          if (( ${#failed[@]} > 0 )); then
            printf 'Failed to publish %d package(s):\n' "${#failed[@]}" >&2
            printf '  %s\n' "${failed[@]}" >&2
            echo "Nothing was pushed; fix the failures and rerun the release." >&2
            exit 1
          fi

      # One tag per release run replaces one tag per released package: the
      # wave tag names a commit whose every version npm already has, so the
      # repository's tag list stops growing by one tag per released package.
      # Annotated, so the push below forwards it with --follow-tags.
      - name: Tag the release wave
        if: inputs.dry_run == false && inputs.publish_only == false
        shell: bash
        run: |
          base="release/$(date -u +%Y-%m-%d)"
          wave_tag="$base"
          suffix=2
          while git rev-parse --verify --quiet "refs/tags/$wave_tag" > /dev/null; do
            wave_tag="$base-$suffix"
            suffix=$((suffix + 1))
          done
          git tag -a "$wave_tag" -m "Release wave ${wave_tag#release/}"

      - name: Push release commit and tags
        if: inputs.dry_run == false && inputs.publish_only == false
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags --atomic

      - name: Create the release-wave GitHub Release
        if: inputs.dry_run == false && inputs.create_github_releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          wave_tag="$(git tag --points-at HEAD | grep '^release/' | head -1 || true)"

          if [[ -n "$wave_tag" ]]; then
            notes="$RUNNER_TEMP/release-wave-notes.md"
            node scripts/wave-release-notes.mjs --tsv="$RUNNER_TEMP/release-packages.tsv" > "$notes"
            if gh release view "$wave_tag" > /dev/null 2>&1; then
              gh release upload "$wave_tag" tarballs/*.tgz --clobber
            else
              gh release create "$wave_tag" tarballs/*.tgz \
                --verify-tag \
                --title "Release ${wave_tag#release/}" \
                --notes-file "$notes"
            fi
            exit 0
          fi

          # A release made before the wave scheme carries per-package tags;
          # its releases keep the per-package shape until those tags are gone.
          while IFS=$'\t' read -r name version _directory tarball; do
            tag="${name}@${version}"
            tarball_path="$GITHUB_WORKSPACE/tarballs/$tarball"
            if [[ ! -f "$tarball_path" ]]; then
              echo "Missing packed tarball: $tarball_path" >&2
              exit 1
            fi

            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" "$tarball_path" --clobber
            else
              gh release create "$tag" "$tarball_path" \
                --verify-tag \
                --title "${name} ${version}" \
                --generate-notes
            fi
          done < "$RUNNER_TEMP/release-packages.tsv"
