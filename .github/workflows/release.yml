name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the release without changing GitHub or npm
        required: true
        default: true
        type: boolean
      first_release:
        description: Resolve versions from package.json because no release tags exist yet
        required: true
        default: false
        type: boolean
      publish_only:
        description: Publish and create GitHub Releases for versions already tagged by a previous run
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a version plan
        if: inputs.publish_only == false
        shell: bash
        run: compgen -G '.nx/version-plans/*.md' > /dev/null

      - name: Preview release
        if: inputs.dry_run && inputs.publish_only == false
        shell: bash
        run: |
          args=(--dry-run)
          if [[ "${{ inputs.first_release }}" == "true" ]]; then
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"

      - name: Apply version plans
        if: inputs.dry_run == false && inputs.publish_only == false
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          args=(--skip-publish)
          if [[ "${{ inputs.first_release }}" == "true" ]]; then
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"

      - name: Select release packages
        if: inputs.dry_run == false || inputs.publish_only
        id: packages
        shell: bash
        run: |
          selection_args=()
          if [[ "${{ inputs.publish_only }}" == "false" ]]; then
            selection_args+=(--release-commit)
          fi

          node scripts/workspace-packages.mjs "${selection_args[@]}" --require --format=github-output >> "$GITHUB_OUTPUT"
          node scripts/workspace-packages.mjs "${selection_args[@]}" --require --format=tsv > "$RUNNER_TEMP/release-packages.tsv"

          if [[ "${{ inputs.publish_only }}" == "true" ]]; then
            while IFS=$'\t' read -r name version _directory _tarball; do
              git rev-parse --verify --quiet "refs/tags/${name}@${version}^{commit}" > /dev/null || {
                echo "Missing release tag ${name}@${version}" >&2
                exit 1
              }
            done < "$RUNNER_TEMP/release-packages.tsv"
          fi

      - name: Run release gates
        if: inputs.dry_run == false || inputs.publish_only
        run: |
          pnpm deps:check
          pnpm check

      - name: Pack release tarballs
        if: inputs.dry_run == false || inputs.publish_only
        shell: bash
        run: |
          mkdir -p tarballs
          for package_dir in ${{ steps.packages.outputs.directories }}; do
            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          done

      - name: Verify release tarballs
        if: inputs.dry_run == false || inputs.publish_only
        run: pnpm tarball:verify:packages ${{ steps.packages.outputs.directories }}

      - name: Upload release artifacts
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Push release commit and tags
        if: inputs.dry_run == false && inputs.publish_only == false
        run: git push origin HEAD:main --follow-tags

      - name: Upgrade npm for trusted publishing
        if: inputs.dry_run == false || inputs.publish_only
        run: npm install --global npm@^11.15.0

      - name: Publish to npm with OIDC
        if: inputs.dry_run == false || inputs.publish_only
        shell: bash
        run: |
          while IFS=$'\t' read -r name version _directory tarball; do
            if [[ "${{ inputs.dry_run }}" == "false" ]] && npm view "${name}@${version}" version --json > /dev/null 2>&1; then
              echo "Skipping ${name}@${version}: already published"
              continue
            fi

            tarball_path="$GITHUB_WORKSPACE/tarballs/$tarball"
            if [[ ! -f "$tarball_path" ]]; then
              echo "Missing packed tarball: $tarball_path" >&2
              exit 1
            fi

            args=("$tarball_path" --access public)
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              args+=(--dry-run)
            fi
            npm publish "${args[@]}"
          done < "$RUNNER_TEMP/release-packages.tsv"

      - name: Create per-package GitHub Releases
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r name version _directory tarball; do
            tag="${name}@${version}"
            tarball_path="$GITHUB_WORKSPACE/tarballs/$tarball"
            if [[ ! -f "$tarball_path" ]]; then
              echo "Missing packed tarball: $tarball_path" >&2
              exit 1
            fi

            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" "$tarball_path" --clobber
            else
              gh release create "$tag" "$tarball_path" \
                --verify-tag \
                --title "${name} ${version}" \
                --generate-notes
            fi
          done < "$RUNNER_TEMP/release-packages.tsv"
