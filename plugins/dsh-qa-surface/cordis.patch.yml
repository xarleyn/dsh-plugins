# The DSH plugin manager discovers the browser half through package.json.
- insert:
    - id: dsh-qa-surface
      name: "@yadsh/dsh-qa-surface"
      config:
        enabled: true
        route:
          path: /qa
          matchChildren: true
        ui:
          showReset: false
        lockdown:
          enabled: true
          sandboxMode: read-only
          approvalPolicy: never
          permissionPreset: qa-read-only
          allowSessionReset: false
          toolPolicy:
            mode: allow-list
            allow: []
