# The DSH plugin manager discovers the browser half through package.json.
- insert:
    - id: dsh-qa-surface
      name: "@yadsh/dsh-qa-surface"
      config:
        enabled: true
        route:
          path: /qa
          matchChildren: true
        ui:
          showReset: false
        # Fail closed: a composed tool gate's `ask` is refused, not answered.
        # A deployment that wants the operator to answer it opts in with
        # `interaction: { approvals: interactive }`.
        interaction:
          approvals: blocked
          # Ask_user_question is refused, not answered (the tool is mounted per
          # preset; opt in with `interaction: { questions: interactive }`).
          questions: unsupported
        lockdown:
          enabled: true
          sandboxMode: read-only
          approvalPolicy: never
          permissionPreset: qa-read-only
          allowSessionReset: false
          toolPolicy:
            mode: allow-list
            allow: []
